<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | MARCH EOI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .auth-wrapper { min-height: calc(100vh - 72px); display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
    .auth-card { background: var(--bg-white); border-radius: var(--radius); box-shadow: var(--shadow-lg); padding: 2.5rem; width: 100%; max-width: 440px; border: 1px solid var(--border); }
    .auth-card h1 { text-align: center; margin-bottom: 0.5rem; font-size: 1.6rem; }
    .auth-card .subtitle { text-align: center; color: var(--text-muted); margin-bottom: 2rem; font-size: 0.95rem; }
    .error-box { background: #FEF2F2; border: 1px solid #FECACA; color: #B91C1C; padding: 0.85rem 1rem; border-radius: var(--radius-sm); margin-bottom: 1.25rem; font-size: 0.9rem; display: none; }
    .error-box.show { display: block; }
    .field-error { color: #DC2626; font-size: 0.8rem; margin-top: 0.3rem; display: none; }
    .form-control.error { border-color: #DC2626; }
    .auth-footer { text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted); }
    .auth-footer a { color: var(--primary); font-weight: 700; }
  </style>
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="../index.html" class="logo"><div class="logo-icon">M</div><span>MARCH</span></a>
      <nav class="nav">
        <a href="../index.html" class="nav-link">الرئيسية</a>
        <a href="apply.html" class="nav-link">كيفية التقديم</a>
        <a href="register.html" class="nav-link">إنشاء حساب</a>
      </nav>
      <div class="header-actions">
        <button class="menu-toggle" aria-label="القائمة"><span></span><span></span><span></span></button>
      </div>
    </div>
  </header>

  <div class="auth-wrapper">
    <div class="auth-card">
      <h1>تسجيل الدخول</h1>
      <p class="subtitle">ادخل إلى حسابك لمتابعة طلبات إبداء الاهتمام</p>
      
      <div class="error-box" id="errorBox"></div>
      
      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="email">البريد الإلكتروني</label>
          <input type="email" id="email" class="form-control" required autocomplete="email" placeholder="name@university.edu">
          <div class="field-error" id="emailError"></div>
        </div>
        <div class="form-group">
          <label for="password">كلمة المرور</label>
          <input type="password" id="password" class="form-control" required autocomplete="current-password" placeholder="••••••••">
          <div class="field-error" id="passwordError"></div>
        </div>
        <button type="submit" class="btn btn-primary btn-lg" style="width:100%;" id="submitBtn">تسجيل الدخول</button>
      </form>
      
      <div class="auth-footer">
        ليس لديك حساب؟ <a href="register.html">إنشاء حساب جديد</a>
      </div>
    </div>
  </div>

  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearErrors();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      let valid = true;
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showFieldError('email', 'أدخل بريداً إلكترونياً صالحاً');
        valid = false;
      }
      if (!password) {
        showFieldError('password', 'كلمة المرور مطلوبة');
        valid = false;
      }
      if (!valid) return;

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'جاري الدخول...';

      try {
        const res = await AuthAPI.login(email, password);
        if (res.success) {
          AuthAPI.saveSession(res.data.token, res.data.user);
          window.location.href = 'dashboard.html';
        } else {
          showError(res.error || 'فشل تسجيل الدخول');
        }
      } catch (err) {
        showError(err.message || 'تعذر الاتصال بالخادم. تأكد من تشغيل الـ API.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'تسجيل الدخول';
      }
    });

    function showError(msg) {
      const box = document.getElementById('errorBox');
      box.textContent = msg;
      box.classList.add('show');
    }
    function showFieldError(field, msg) {
      const input = document.getElementById(field);
      const err = document.getElementById(field + 'Error');
      input.classList.add('error');
      err.textContent = msg;
      err.style.display = 'block';
    }
    function clearErrors() {
      document.getElementById('errorBox').classList.remove('show');
      document.querySelectorAll('.form-control').forEach(el => el.classList.remove('error'));
      document.querySelectorAll('.field-error').forEach(el => { el.style.display = 'none'; el.textContent = ''; });
    }
  </script>
</body>
</html>
